<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>橋を渡れ！ みんなで渡る崩れる吊り橋</title>
<meta name="description" content="崩れやすい吊り橋を、みんなで同時に渡る。急ぐと割れる、慎重すぎると時間切れ。1〜100人。リンクを送るだけでスマホから遊べる。">
<meta property="og:type" content="website">
<meta property="og:title" content="橋を渡れ！ みんなで渡る崩れる吊り橋">
<meta property="og:description" content="崩れやすい吊り橋を、みんなで同時に渡る。急ぐと割れる、慎重すぎると時間切れ。1〜100人。リンクを送るだけでスマホから遊べる。">
<meta property="og:site_name" content="橋を渡れ！">
<meta name="twitter:title" content="橋を渡れ！">
<meta name="twitter:description" content="崩れやすい吊り橋を、みんなで同時に渡る。急ぐと割れる、慎重すぎると時間切れ。1〜100人。リンクを送るだけでスマホから遊べる。">
<meta name="twitter:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0f1d22">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script>
  // 起動に失敗したときに原因を画面に出す（module の読み込み自体が失敗すると中の catch は動かないため、素の script で拾う）
  window.__errs = []
  window.addEventListener('error', e => window.__errs.push(e.message || String(e)))
  window.addEventListener('unhandledrejection', e => window.__errs.push(String(e.reason)))
  setTimeout(() => {
    if (window.__boot) return
    const d = document.getElementById('bootErr')
    d.hidden = false
    d.textContent = '起動できませんでした: ' + (window.__errs.join(' / ') || '読み込み失敗') + ' / ' + navigator.userAgent
  }, 5000)
  // 拡大を止める（iOS は viewport の指定を無視するので、ピンチ・ダブルタップ・Ctrl+ホイールを直接止める）
  ;(() => {
    const stop = e => e.preventDefault()
    for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, stop, { passive: false })
    document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault() }, { passive: false })
    let lastEnd = 0
    document.addEventListener('touchend', e => {
      const now = Date.now()
      if (now - lastEnd < 350 && !e.target.closest('input,button,summary,a')) e.preventDefault()
      lastEnd = now
    }, { passive: false })
    document.addEventListener('dblclick', stop, { passive: false })
    document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault() }, { passive: false })
    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault() })
  })()
</script>
</head>
<body>
<div id="bootErr" class="boot-err" hidden></div>

<header class="top">
  <span class="logo" id="logo"><svg viewBox="0 0 32 20" aria-hidden="true"><path d="M2 6q14 10 28 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M7 10v5M12 12v5M17 12.5v5M22 12v5M27 10v5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>橋を渡れ！</span>
  <span class="net" id="net" data-s="connecting">接続しています</span>
</header>

<main>
  <section id="home" class="card" hidden>
    <h1 id="homeTitle">橋を渡れ！</h1>
    <p id="homeLead" class="lead">崩れやすい吊り橋を、みんなで同時に渡る。急ぐと割れる。慎重すぎると時間切れ。</p>
    <label class="field">ニックネーム
      <input id="name" maxlength="12" autocomplete="nickname" placeholder="例: たろう" enterkeyhint="done">
    </label>
    <button id="createBtn" class="primary">部屋を作る</button>
    <details id="joinBox">
      <summary>参加コードで入る</summary>
      <div class="row">
        <input id="code" maxlength="4" inputmode="latin" autocapitalize="characters" placeholder="ABCD" aria-label="参加コード">
        <button id="joinBtn">参加</button>
      </div>
    </details>
    <div id="howto" class="howto">
      <p class="howto-h">遊び方（1〜100人・1分前後）</p>
      <ul>
        <li><b>ドラッグ</b>で歩く。<b>走る</b>を押すと速いが板が傷む</li>
        <li>同じ板に人が集まると割れる。区間ごとにも重さの上限がある</li>
        <li><b>突風</b>の区間では止まる。動くと重さ3倍</li>
        <li>穴に落ちたらスタートからやり直し</li>
        <li>時間内に<b>7割がゴール</b>でチーム成功。個人は着順</li>
      </ul>
    </div>
  </section>

  <section id="lobby" class="card" hidden>
    <p class="muted">参加コード</p>
    <p class="code" id="roomCode"></p>
    <div class="row">
      <input id="invite" readonly aria-label="招待URL">
      <button id="copyBtn">招待</button>
    </div>
    <p class="muted"><span id="count"></span></p>
    <ul id="players" class="players"></ul>
    <p id="lobbyHint" class="hint"></p>
    <button id="startBtn" class="primary" hidden>スタート</button>
    <button id="leaveBtn" class="ghost">部屋を出る</button>
  </section>

  <section id="game" hidden>
    <div id="stage" class="stage"></div>
    <button id="quitBtn" class="ghost small quit">退出</button>
  </section>

  <section id="result" class="card" hidden>
    <h2 id="resultTitle" class="result-title"></h2>
    <div id="resultBody"></div>
    <p id="resultHint" class="hint"></p>
    <button id="rematchBtn" class="primary" hidden>もう一回</button>
    <button id="lobbyBtn" class="ghost" hidden>ロビーに戻る</button>
  </section>
</main>

<div id="toast" class="toast" role="status" hidden></div>
<footer class="foot"><span id="ping"></span></footer>

<script type="module" src="/app.js"></script>
</body>
</html>
